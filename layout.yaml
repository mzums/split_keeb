meta:
  engine: 4.1.0

units:
  kx: cx
  ky: cy
  px: kx + 2
  py: ky + 2

points:
  zones:
    matrix:
      anchor:
        rotate: 20
      columns:
        first:
        pinky:
        ring:
          key.splay: -2
          key.origin: [-12, -19]
          key.stagger: 8
        middle:
          key.stagger: 8
        index:
          key.stagger: -6
        inner:
          key.stagger: -2
      rows:
        bottom:
        home:
        top:

    thumbfan:
      anchor:
        ref: matrix_inner_bottom
        shift: [-45, -19]
      columns:
        near:
        home:
          key.spread: 21.25
          key.splay: -10
          key.origin: [-11.75, -9]
        far:
          key.spread: 21.25
          key.splay: -18
          key.origin: [-9.5, -9]
        far2:
          key.spread: 21.25
          key.splay: -28
          key.origin: [-9.5, -9]
      rows:
        thumb:

  rotate: -20

outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]

  keys:
    - what: rectangle
      where: true
      size: [kx - 0.5, ky - 0.5]

  board:
    - what: polygon
      operation: stack
      points:
        # ---- upper edge
        - ref: matrix_pinky_top
          shift: [-1.5px, 0.5py]
        - ref: matrix_first_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_index_top
          shift: [-0.5px, 0.8py]
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]

        # ---- rigth edge
        - ref: matrix_inner_home
          shift: [0.5px, 0]
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.5py]

        # ---- Thumbfan
        - ref: thumbfan_far2_thumb
          shift: [1.0px, 0.5py]
        - ref: thumbfan_far_thumb
          shift: [-0.5px, -0.5py]
        - ref: thumbfan_home_thumb
          shift: [-0.5px, -0.5py]
        - ref: thumbfan_near_thumb
          shift: [-0.5px, -0.5py]

        # ---- bottom edge
        - ref: matrix_index_bottom
          shift: [-2.5px, -1.2py]
        - ref: matrix_pinky_bottom
          shift: [-0.5px, -0.5py]
        - ref: matrix_ring_bottom
          shift: [-2.5px, -1.0py]

      fillet: 2

  combo:
    - name: board
    - operation: subtract
      name: keys

pcbs:
  keyboard:
    outlines:
      main:
        outline: board
        layer: Edge.Cuts

    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"